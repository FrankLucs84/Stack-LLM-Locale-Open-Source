<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1F3A5F"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2E7D32"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="64" fill="#1F3A5F"/>
  <rect x="0" y="0" width="10" height="64" fill="#6A1B9A"/>
  <text x="30" y="41" font-size="26" font-weight="bold" fill="#FFFFFF">Il pattern LLM Wiki — ciclo operativo</text>

  <!-- Three layers on left -->
  <text x="70" y="110" font-size="16" font-weight="bold" fill="#1A2332">TRE STRATI</text>

  <rect x="60" y="130" width="230" height="70" rx="10" fill="#E8EDF2" stroke="#5A6270" stroke-width="2"/>
  <text x="175" y="160" font-size="16" font-weight="bold" fill="#1A2332" text-anchor="middle">raw/</text>
  <text x="175" y="182" font-size="12.5" fill="#5A6270" text-anchor="middle">fonti immutabili (sola lettura)</text>

  <rect x="60" y="215" width="230" height="90" rx="10" fill="#EDE7F6" stroke="#6A1B9A" stroke-width="2"/>
  <text x="175" y="245" font-size="16" font-weight="bold" fill="#1A2332" text-anchor="middle">wiki/</text>
  <text x="175" y="267" font-size="12.5" fill="#5A6270" text-anchor="middle">pagine generate e mantenute</text>
  <text x="175" y="286" font-size="12.5" fill="#5A6270" text-anchor="middle">dall'agente · index.md · log.md</text>

  <rect x="60" y="320" width="230" height="70" rx="10" fill="#FBF0D9" stroke="#B5651D" stroke-width="2"/>
  <text x="175" y="350" font-size="16" font-weight="bold" fill="#1A2332" text-anchor="middle">AGENTS.md</text>
  <text x="175" y="372" font-size="12.5" fill="#5A6270" text-anchor="middle">schema: le regole del mantenimento</text>

  <!-- Three operations cycle on right -->
  <text x="640" y="110" font-size="16" font-weight="bold" fill="#1A2332">TRE OPERAZIONI</text>

  <!-- Ingest -->
  <rect x="560" y="130" width="360" height="78" rx="10" fill="#E3F2E4" stroke="#2E7D32" stroke-width="2"/>
  <circle cx="588" cy="158" r="15" fill="#2E7D32"/><text x="588" y="164" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="620" y="158" font-size="17" font-weight="bold" fill="#1A2332">Ingest</text>
  <text x="620" y="180" font-size="12.5" fill="#5A6270">nuova fonte → l'agente aggiorna 10-15 pagine,</text>
  <text x="620" y="196" font-size="12.5" fill="#5A6270">index.md e log.md</text>

  <!-- Query -->
  <rect x="560" y="230" width="360" height="78" rx="10" fill="#E6F0FA" stroke="#1565C0" stroke-width="2"/>
  <circle cx="588" cy="258" r="15" fill="#1565C0"/><text x="588" y="264" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="620" y="258" font-size="17" font-weight="bold" fill="#1A2332">Query</text>
  <text x="620" y="280" font-size="12.5" fill="#5A6270">domanda → risposta dalla wiki; le buone risposte</text>
  <text x="620" y="296" font-size="12.5" fill="#5A6270">diventano nuove pagine (la conoscenza si accumula)</text>

  <!-- Lint -->
  <rect x="560" y="330" width="360" height="78" rx="10" fill="#FBE3E3" stroke="#C62828" stroke-width="2"/>
  <circle cx="588" cy="358" r="15" fill="#C62828"/><text x="588" y="364" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="620" y="358" font-size="17" font-weight="bold" fill="#1A2332">Lint</text>
  <text x="620" y="380" font-size="12.5" fill="#5A6270">controllo periodico: contraddizioni, pagine orfane,</text>
  <text x="620" y="396" font-size="12.5" fill="#5A6270">affermazioni stale, link mancanti</text>

  <!-- cycle arrows -->
  <path d="M 740 208 L 740 226" fill="none" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M 740 308 L 740 326" fill="none" stroke="#1F3A5F" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M 930 369 C 970 369 970 158 942 158" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ag)"/>
  <text x="958" y="265" font-size="12" fill="#2E7D32" font-weight="bold" transform="rotate(90 958 265)">ciclo continuo</text>

  <!-- connect layers to operations -->
  <path d="M 290 175 C 420 175 430 168 556 168" fill="none" stroke="#5A6270" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="400" y="150" font-size="11.5" fill="#5A6270" font-style="italic">legge</text>
  <path d="M 290 260 C 420 260 430 268 556 268" fill="none" stroke="#6A1B9A" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="398" y="248" font-size="11.5" fill="#6A1B9A" font-style="italic">scrive/mantiene</text>
  <path d="M 290 355 C 420 355 430 368 556 368" fill="none" stroke="#B5651D" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#a)"/>
  <text x="392" y="343" font-size="11.5" fill="#B5651D" font-style="italic">governa tutte</text>

  <!-- principle banner -->
  <rect x="60" y="440" width="860" height="60" rx="10" fill="#F3F7FB" stroke="#AEC4DA" stroke-width="1.5"/>
  <text x="490" y="466" font-size="15" font-weight="bold" fill="#1F3A5F" text-anchor="middle">Principio: COMPILAZIONE, non recupero</text>
  <text x="490" y="487" font-size="13" fill="#5A6270" text-anchor="middle">La conoscenza è sintetizzata al momento dell'ingest, non ri-cercata a ogni domanda. La wiki è l'artefatto; le fonti sono la verità.</text>

  <!-- local-first note -->
  <rect x="60" y="515" width="860" height="54" rx="10" fill="#FDF3E7" stroke="#E65100" stroke-width="1.5"/>
  <text x="80" y="538" font-size="13" font-weight="bold" fill="#E65100">Adattamento local-first:</text>
  <text x="80" y="558" font-size="12.5" fill="#1A2332">l'agente (OpenWorker/Hermes) e il modello (Qwen3 via Ollama) girano sulla tua macchina — la wiki è un repo git locale, nessun dato esce.</text>

  <text x="490" y="600" font-size="11.5" fill="#9AA4B0" text-anchor="middle" font-style="italic">Diagramma originale — pattern LLM Wiki (Karpathy) adattato allo stack locale</text>
</svg>
